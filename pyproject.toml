[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "um-world-model"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1", "pydantic>=2.9", "httpx>=0.27", "pyyaml>=6", "pyarrow>=17", "rapidfuzz>=3.10", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]
geo = ["shapely>=2", "geopandas>=1"]
discovery = ["xlrd>=2", "openpyxl>=3.1"]

[project.scripts]
umwm = "um_world_model.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
